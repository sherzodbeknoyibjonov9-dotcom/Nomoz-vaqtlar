name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Android loyihasini yaratish
        run: flutter create --platforms=android --org uz.namoz --project-name namoz_vaqtlari .

      - name: Manifestni sozlash
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' $MANIFEST
          sed -i 's|android:label="[^"]*"|android:label="Namoz vaqtlari"|' $MANIFEST

      - run: flutter pub get

      - name: APK yig'ish
        run: flutter build apk --release

      - name: APK ni saqlash
        uses: actions/upload-artifact@v4
        with:
          name: namoz-vaqtlari-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: GitHub Releases ga chiqarish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Namoz vaqtlari v${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
